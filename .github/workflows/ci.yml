name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Manifest sanity
        run: |
          node -e '
            const p = require("./package.json");
            const fail = (m) => { console.error(m); process.exit(1); };
            if (!p.dsh?.bundle?.patch) fail("dsh.bundle.patch is missing");
            if (!p.dsh?.client) fail("dsh.client is missing");
            if (!p.engines?.dsh) fail("engines.dsh is missing");
            if (p.name.startsWith("@local/")) fail("package name is still a local placeholder");
            if (!p.files?.includes("client.js")) fail("files must ship client.js");
            if (!p.files?.includes("cordis.patch.yml")) fail("files must ship cordis.patch.yml");
            console.log("manifest ok");
          '

      - name: Package contents
        run: npm pack --dry-run
